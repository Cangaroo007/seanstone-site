name = "seanstone-id"
main = "index.js"
compatibility_date = "2026-08-01"

# Serve it from a subdomain of the site so there is no third-party cookie story
# and no CORS surprises. Add the DNS record as a proxied (orange cloud) CNAME
# or A record for id.seanstone.com first — see README.md in this folder.
routes = [
  { pattern = "id.seanstone.com", custom_domain = true }
]

# Account pinned explicitly: this machine's shell exports a CLOUDFLARE_ACCOUNT_ID
# for a different account, which is how the first deploy went to the wrong place.
account_id = "16fbf46ad93708dc1953b6a283488d6d"

# Cloudflare Email Service. Sending to a VERIFIED DESTINATION ADDRESS on your own
# account is free on every plan, including Workers Free — and Sean is the only
# recipient this Worker will ever have, which `destination_address` enforces at
# the platform level rather than in code.
#
# Setup, once, in the dashboard: seanstone.com -> Email -> Email Routing -> enable,
# then add sean@cangaroo.ai as a destination address and click the link in the
# verification email Cloudflare sends you.
[[send_email]]
name = "EMAIL"
destination_address = "sean@cangaroo.ai"

# kb.md is imported as a text module by index.js, so the knowledge base stays a
# plain markdown file that Sean can read and edit rather than a generated blob.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# The Anthropic key lives as a secret, never in this file:
#   wrangler secret put ANTHROPIC_KEY
# Optional model override (default claude-sonnet-5; haiku is cheaper):
#   [vars]
#   ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"

# The record. Create it once, then apply the schema:
#   wrangler d1 create seanstone
#   wrangler d1 execute seanstone --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "seanstone"
database_id = "f99f8e8d-50da-4de5-af07-3152ad8598e6"

# The password for https://id.seanstone.com/admin — any username, this password:
#   wrangler secret put ADMIN_PASSWORD
